<!doctype html><html><head><meta charset="utf-8">
<!--
  Reel cover / hook card, 1080x1920.

  One file makes every card: the copy arrives in the URL hash so nothing here is
  per-card, and `scripts/art/reels.json` is the only place a Reel's text lives.
  Wrap a fragment in {curly braces} to set it in the accent colour — that is the
  whole markup language, deliberately, because a richer one would tempt someone
  to lay a card out by hand and the set would stop looking like a set.

  Colours are the app's own tokens (src/ui/theme.ts), so the feed and the
  product agree with each other.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
  html,body{margin:0;padding:0;background:#0B0F14}
  .c{
    width:1080px;height:1920px;position:relative;overflow:hidden;background:#0B0F14;
    font-family:Inter,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%, #14301E 0%, #0B0F14 68%)}
  .inner{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:110px 90px}
  .kicker{font-size:30px;font-weight:600;letter-spacing:7px;color:#8A97A6;text-transform:uppercase}
  .hook{font-size:118px;line-height:1.08;font-weight:800;color:#F2F6FA;letter-spacing:-2px}
  .hook .hi{color:#5BE895}
  .rule{width:140px;height:8px;background:#5BE895;border-radius:4px;margin-bottom:54px}
  .foot{display:flex;justify-content:space-between;align-items:flex-end}
  .foot div{font-size:28px;color:#8A97A6;font-weight:400}
  .foot .id{font-weight:600;color:#5BE895;letter-spacing:2px}
</style></head>
<body><div class="c" id="c">
  <div class="glow"></div>
  <div class="inner">
    <div class="kicker" id="kicker">Degree Route · build in public</div>
    <div>
      <div class="rule"></div>
      <div class="hook" id="hook"></div>
    </div>
    <div class="foot">
      <div class="id" id="rid"></div>
      <div id="day"></div>
    </div>
  </div>
</div>
<script>
  const q = new URLSearchParams(decodeURIComponent(location.hash.slice(1)));
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // {braced} runs become accent-coloured. Escape first, then mark up, so a
  // hook containing "<" or "&" cannot inject anything into the card.
  document.getElementById('hook').innerHTML =
    esc(q.get('hook') ?? '').replace(/\{([^}]*)\}/g, '<span class="hi">$1</span>');
  document.getElementById('rid').textContent = q.get('id') ?? '';
  document.getElementById('day').textContent = q.get('day') ?? '';
</script></body></html>
